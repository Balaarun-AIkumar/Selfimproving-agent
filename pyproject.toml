[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careloop-agent"
version = "2.0.0"
description = "A local patient scheduling agent with evidence-driven, regression-gated improvement"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["scheduler*"]

[tool.setuptools.package-data]
scheduler = ["web/*", "scenarios/*.json"]
